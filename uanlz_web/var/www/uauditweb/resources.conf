[
  {
    "uriRegexs": [
      "^/resources\\.conf$",
      "^/inc\\..*",
      "^/mods/[^/]+/inc\\..*"
    ],
    "actions": [
      {
        "type": "DENY"
      }
    ]
  },
  {
    "uriRegexs": [
      "^/assets/.*$"
    ],
    "actions": [
      {
        "type": "ACCEPT"
      }
    ]
  },
  {
    "uriRegexs": [
      "^/.*$"
    ],
    "requireSession": true,
    "actions": [
      {
        "type": "PROCESS_AS",
        "mode": "HTMLI"
      },
      {
        "type": "ACCEPT"
      }
    ]
  },
  {
    "uriRegexs": [
      "^/.*$"
    ],
    "actions": [
      {
        "type": "REDIRECT",
        "location": "/auth/retokenize/"
      }
    ]
  }
]
