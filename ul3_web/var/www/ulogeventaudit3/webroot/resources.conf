[
  {
    "_comment": "Never expose resource policy or server-side partials",
    "uriRegexs": [
      "^/resources\\.conf$",
      "^/includes(/.*)?$"
    ],
    "actions": [
      {
        "type": "DENY"
      }
    ]
  },
  {
    "_comment": "Editor pages require read and write scopes",
    "uriRegexs": [
      "^/mods/alerts/(rule-add|action-add|input-add)\\.html$"
    ],
    "requireSession": true,
    "requiredScopes": [
      "stats",
      "control"
    ],
    "actions": [
      {
        "type": "PROCESS_AS",
        "mode": "MANTIDSLANG"
      },
      {
        "type": "ACCEPT"
      }
    ]
  },
  {
    "_comment": "Reject direct editor requests without permission",
    "uriRegexs": [
      "^/mods/alerts/(rule-add|action-add|input-add)\\.html$"
    ],
    "requireSession": true,
    "actions": [
      {
        "type": "DENY"
      }
    ]
  },
  {
    "_comment": "Subsystem pages require read access",
    "uriRegexs": [
      "^/mods/.*\\.html$"
    ],
    "requireSession": true,
    "requiredScopes": [
      "stats"
    ],
    "actions": [
      {
        "type": "PROCESS_AS",
        "mode": "MANTIDSLANG"
      },
      {
        "type": "ACCEPT"
      }
    ]
  },
  {
    "_comment": "Reject subsystem requests without read access",
    "uriRegexs": [
      "^/mods/.*$"
    ],
    "requireSession": true,
    "actions": [
      {
        "type": "DENY"
      }
    ]
  },
  {
    "_comment": "Authenticated HTML shell",
    "uriRegexs": [
      "^/index\\.html$",
      "^/$"
    ],
    "requireSession": true,
    "actions": [
      {
        "type": "PROCESS_AS",
        "mode": "MANTIDSLANG"
      },
      {
        "type": "ACCEPT"
      }
    ]
  },
  {
    "_comment": "Serve local assets without template processing",
    "uriRegexs": [
      "^/assets/.*$",
      "^/local/.*$"
    ],
    "requireSession": true,
    "actions": [
      {
        "type": "ACCEPT"
      }
    ]
  },
  {
    "_comment": "Login is handled by the configured portal redirect",
    "uriRegexs": [
      "^/login(/.*)?$"
    ],
    "actions": [
      {
        "type": "ACCEPT"
      }
    ]
  },
  {
    "_comment": "Unauthenticated requests go to uFastAuthD3",
    "uriRegexs": [
      "^/.*$"
    ],
    "disallowSession": true,
    "actions": [
      {
        "type": "REDIRECT",
        "location": "/auth/retokenize/"
      }
    ]
  },
  {
    "_comment": "Deny other resources",
    "uriRegexs": [
      "^/.*$"
    ],
    "actions": [
      {
        "type": "DENY"
      }
    ]
  }
]
