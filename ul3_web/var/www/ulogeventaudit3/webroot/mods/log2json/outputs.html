<script>


  // Default Main View:
  function auditReady() {
    mainview_log2json_output_start();
  }
</script>

<div id="span-log2json-output-body" data-empty="No JSON outputs configured.">
</div>

<script>
    function drawLog2JSONOutputStats(outputStats) {
        document.getElementById("span-log2json-output-body").innerHTML = "";
        let i = 0;

        for (let output of outputStats) {

            $("#span-log2json-output-body").append(
                `
                    <div class="card">
            <div class="card-header">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .75rem;">
                    <span><b>Host/Port:</b> <span id="span-log2json-output-hostport-${i}"></span></span>
                    <span><b>Status:</b> <span id="span-log2json-output-status-${i}"></span></span>
                </div>
            </div>
            <div class="card-body">





                <div class="stats-layout">
                    <section class="queue-panel"><h2>Output JSON queue</h2>
                        <div class="progress mx-auto" data-value="0" id="span-log2json-output-perc0-${i}" role="progressbar" aria-label="Output queue usage" aria-valuemin="0" aria-valuemax="100">
                            <span class="progress-left"><span class="progress-bar border-success" id="span-log2json-output-color0-${i}"></span></span><span class="progress-right"><span class="progress-bar border-success" id="span-log2json-output-color1-${i}"></span></span>
                            <div class="progress-value w-100 h-100 rounded-circle d-flex align-items-center justify-content-center"><span class="h2" id="span-log2json-output-perc1-${i}">—</span><span class="ms-1">%</span></div>
                        </div><div class="queue-count" id="span-log2json-output-perctext-${i}">—</div><div class="form-text">Queued / capacity</div>
                    </section>
                    <table class="table table-hover" aria-label="Output queue metrics"><thead><tr><th scope="col">JSON queue</th><th scope="col" class="text-end">Value</th></tr></thead><tbody><tr><td>Dropped</td><td class="text-end fw-semibold" id="span-log2json-output-dropped-${i}">—</td></tr><tr><td>Sent</td><td class="text-end fw-semibold" id="span-log2json-output-processed-${i}">—</td></tr></tbody></table>
                </div>
            </div>
          </div>
<br>

                `
            );

            $(`#span-log2json-output-hostport-${i}`).text(output["id"]);
            $(`#span-log2json-output-dropped-${i}`).text(output["queue"]["dropped"]);
            $(`#span-log2json-output-processed-${i}`).text(output["queue"]["processed"]);

            if (output["connected"] == true)
            {
                $(`#span-log2json-output-status-${i}`).append("<span class=\"badge text-bg-success\">Connected</span>");
            }
            else
            {
                $(`#span-log2json-output-status-${i}`).append("<span class=\"badge text-bg-danger\">Disconnected</span>");
            }

            $(`#span-log2json-output-perctext-${i}`).text( output["queue"]["size"] + "/" + output["queue"]["maxItems"] );

            let percentage = (output["queue"]["size"]*100)/output["queue"]["maxItems"];
            //percentage = 80.43;
            percentage = parseInt(percentage);

           fillPercentage(  `span-log2json-output-perc1-${i}`,
                            `span-log2json-output-perc0-${i}`,
                            `span-log2json-output-color0-${i}`,
                            `span-log2json-output-color1-${i}`,
                            percentage );

            i++;
        }

        redrawProgressBars();
    }

    function mainview_log2json_output_start() {
        var payloadData = { "method": "GET", "resource": "log2json/outputs" }
        auditRequest(payloadData, {
            success: function (result) {
                drawLog2JSONOutputStats(result["outputs"]);
            },
            error: commonFunctionError
        });
    }
    function mainview_log2json_output_stop() {
        //   alert('Stopping alert outputs');
    }
</script>
