; uLogEventAudit3 - libMantids30 REST / uFastAuthD3
; Relative paths are resolved from this configuration directory.
Logs
{
    Debug false
    ShowDate true
    ShowColors true
}
Authentication
{
    AppName "ULOGEVENTAUDIT3"
    ; Prefer environment variable UL3_API_KEY for the application API key.
    APIKey "REPLACEME_UFASTAUTHD3_APPLICATION_KEY"
}
RPCServer
{
    AlertsApiKey "REPLACEME_XABCXAPIX_ALERTS"
    Log2JSONApiKey "REPLACEME_XABCXAPIX_LOG2JSON"
    ListenAddr "127.0.0.1"
    ListenPort 33001
    UseIPv6 false
    MaxClients 16
    CertFile "snakeoil.crt"
    KeyFile "snakeoil.key"
}
WebService
{
    Listener_TLS
    {
        Protocol TLS
        ListenAddr "0.0.0.0"
        ListenPort 33000
        UseIPv6 false
        TLS
        {
            CertFile "snakeoil.crt"
            KeyFile "snakeoil.key"
        }
    }
    Logs
    {
        Dir "/var/log/ulogeventaudit3"
        CreateDir true
        File "ul3_web.log"
    }
    ResourcesPath "/var/www/ulogeventaudit3/webroot"
    OverlappedDirectories
    {
        /assets
        {
            Path "/var/www/ulogeventaudit3/global/assets"
        }
    }
    APISync
    {
        APISyncHost "login.localhost"
        APISyncPort 7081
        ; Compatibility: APISync currently reads this path from the parent block.
        PrivateCAPath "ca.crt"
        UseTLS true
        TLS
        {
            CheckTLSPeer true
            UsePrivateCA true
            PrivateCAPath "ca.crt"
        }
    }
    JWT
    {
        UseAPISync true
    }
    API
    {
        Origins "https://audit.localhost:33000"
    }
    Threads
    {
        UseThreadPool false
        MaxConcurrentClients 128
    }
    Proxies
    {
        "/auth"
        {
            UseTLS true
            RemoteHost "login.localhost"
            RemotePort 7080
            TLS
            {
                CheckTLSPeer true
                UsePrivateCA true
                PrivateCAPath "ca.crt"
            }
            ExtraHeaders
            {
                "x-api-key" "%APIKEY%"
            }
        }
        "/login"
        {
            UseTLS true
            RemoteHost "login.localhost"
            RemotePort 8443
            TLS
            {
                CheckTLSPeer true
                UsePrivateCA true
                PrivateCAPath "ca.crt"
            }
            ExtraHeaders
            {
                "x-api-key" "%APIKEY%"
            }
            TransformCookiePath true
        }
    }
    Login
    {
        Origins "https://login.localhost:8443"
        RedirectURL "https://login.localhost:8443/?app=ULOGEVENTAUDIT3&loggedIn=false"
    }
}
